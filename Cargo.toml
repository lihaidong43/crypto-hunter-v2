[package]
name = "crypto-hunter"
version = "0.1.0"
edition = "2021"

[dependencies]
csv = "1.3"
# HTTP客户端
reqwest = { version = "0.11", features = ["json", "stream"] }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"

# 数据库
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "chrono"] }
deadpool-postgres = "0.14"

# 配置管理
config = "0.13"
dotenv = "0.15"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 错误处理
anyhow = "1.0"
thiserror = "1.0"

# 数值计算
rust_decimal = { version = "1.39", features = ["serde-float", "db-tokio-postgres"] }
rust_decimal_macros = "1.39"

# Telegram Bot
teloxide = "0.12"

# 工具
uuid = { version = "1.6", features = ["v4", "serde"] }
dashmap = "5.5"

# 定时任务
tokio-cron-scheduler = "0.9"
tokio-postgres = { version = "0.7.15", features = ["with-chrono-0_4"] }

# 命令行参数解析
clap = { version = "4.5", features = ["derive"] }

# 速率限制器
governor = "0.6"

# WebSocket客户端
# 使用 rustls 避免 native-tls 在部分环境下的握手/证书链问题
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
url = "2.5"
# TLS 支持（用于代理连接，版本需与 tokio-tungstenite 兼容）
rustls = "0.22"
rustls-pki-types = "1.0"
webpki-roots = "0.25"
tokio-rustls = "0.25"
rustls-native-certs = "0.6"

[[bin]]
name = "query_arbitrage"
path = "src/bin/query_arbitrage.rs"

[[bin]]
name = "pair-collector"
path = "src/bin/pair_collector.rs"

[[bin]]
name = "symbol-tester"
path = "src/bin/symbol_tester.rs"

[[bin]]
name = "historical-collector"
path = "src/bin/historical_collector.rs"

[[bin]]
name = "clean-data"
path = "src/bin/clean_data.rs"

[[bin]]
name = "arbitrage-monitor"
path = "src/bin/arbitrage_monitor.rs"

[[bin]]
name = "ws-test"
path = "src/bin/ws_test.rs"
